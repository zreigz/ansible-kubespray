---
- name: Deploy Single Node Kubernetes via Kubespray
  hosts: localhost
  gather_facts: yes

  vars:
    kubespray_repo: https://github.com/kubernetes-sigs/kubespray.git
    kubespray_version: release-2.30.0
    kubespray_path: /plural/kubespray
    inventory_name: single
    node_ip: "{{ hostvars[groups['k8s'][0]]['ansible_host'] }}"

  tasks:

    - name: Install dependencies (Ubuntu/Debian)
      become: yes
      apt:
        name:
          - git
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure kubespray parent directory exists
      file:
        path: "{{ kubespray_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Clone Kubespray
      become: yes
      git:
        repo: "{{ kubespray_repo }}"
        dest: "{{ kubespray_path }}"
        version: "{{ kubespray_version }}"
        force: yes

    - name: Create Python virtual environment
      become: yes
      command: python3 -m venv venv
      args:
        chdir: "{{ kubespray_path }}"
        creates: "{{ kubespray_path }}/venv"

    - name: Install Python requirements
      become: yes
      pip:
        requirements: "{{ kubespray_path }}/requirements.txt"
        virtualenv: "{{ kubespray_path }}/venv"

    - name: Create inventory folder
      become: yes
      command: cp -rfp inventory/sample inventory/{{ inventory_name }}
      args:
        chdir: "{{ kubespray_path }}"
        creates: "{{ kubespray_path }}/inventory/{{ inventory_name }}"

    - name: Generate single-node inventory
      become: yes
      command: >
        {{ kubespray_path }}/venv/bin/python3
        contrib/inventory_builder/inventory.py
        {{ node_ip }}
      args:
        chdir: "{{ kubespray_path }}"
      environment:
        CONFIG_FILE: "{{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml"

    - name: Deploy Kubernetes (single node)
      become: yes
      command: >
        {{ kubespray_path }}/venv/bin/ansible-playbook
        -i inventory/{{ inventory_name }}/hosts.yaml
        --become --become-user=root
        cluster.yml
      args:
        chdir: "{{ kubespray_path }}"