---
- name: Prepare Kubespray environment
  hosts: localhost
  gather_facts: no

  vars:
    kubespray_path: "{{ playbook_dir }}/kubespray"
    inventory_path: "{{ kubespray_path }}/inventory/single"

  tasks:

    - name: Install Python requirements
      pip:
        requirements: "{{ kubespray_path }}/requirements.txt"
      check_mode: no

    - name: Create inventory directory
      file:
        path: "{{ inventory_path }}"
        state: directory
        mode: '0755'
      check_mode: no

    - name: Copy group_vars from sample
      copy:
        src: "{{ kubespray_path }}/inventory/sample/group_vars"
        dest: "{{ inventory_path }}/"
        remote_src: yes
      check_mode: no

    - name: Copy inventory file
      copy:
        src: "{{ playbook_dir }}/inventory.yaml"
        dest: "{{ inventory_path }}/inventory.yaml"
        remote_src: yes
      check_mode: no

    - name: Run Kubespray cluster.yml
      shell: >
        ansible-playbook
        -i {{ inventory_path }}/inventory.yaml
        --become
        -e ignore_assert_errors=yes
        -e minimal_master_memory_mb=0
        -e minimal_node_memory_mb=0
        {{ kubespray_path }}/cluster.yml
      args:
        chdir: "{{ kubespray_path }}"
      check_mode: no
      when: not ansible_check_mode

