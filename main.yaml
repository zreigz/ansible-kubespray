---
- name: Deploy Single Node Kubernetes via Kubespray
  hosts: localhost
  gather_facts: yes

  vars:
    kubespray_repo: https://github.com/kubernetes-sigs/kubespray.git
    kubespray_version: release-2.30
    kubespray_path: /plural/kubespray
    inventory_name: single
    node_ip: "{{ hostvars[groups['k8s'][0]]['ansible_host'] }}"

  tasks:
    - name: Install dependencies (Debian/Ubuntu control node)
      become: yes
      become_method: sudo
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - sshpass
          - rsync
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Remove existing kubespray directory if present
      file:
        path: "{{ kubespray_path }}"
        state: absent

    - name: Clone Kubespray
      shell: "git clone --depth=1 --branch {{ kubespray_version }} {{ kubespray_repo }} {{ kubespray_path }}"

    - name: Stat kubespray directory after clone
      stat:
        path: "{{ kubespray_path }}"
      register: kubespray_stat

    - name: Debug kubespray stat result
      debug:
        msg: "exists={{ kubespray_stat.stat.exists }} isdir={{ kubespray_stat.stat.get('isdir', 'N/A') }} owner={{ kubespray_stat.stat.get('pw_name', 'N/A') }}"

    - name: List kubespray directory contents
      shell: "ls -la {{ kubespray_path }}"
      register: kubespray_dir_contents

    - name: Debug kubespray directory contents
      debug:
        msg: "{{ kubespray_dir_contents.stdout_lines }}"

    - name: Create Python virtual environment
      shell: "python3 -m venv {{ kubespray_path }}/venv"
      args:
        creates: "{{ kubespray_path }}/venv/bin/python3"

    - name: Install Python requirements
      shell: "{{ kubespray_path }}/venv/bin/pip install -r {{ kubespray_path }}/requirements.txt"
      args:
        creates: "{{ kubespray_path }}/venv/lib"

    - name: Create inventory directory
      file:
        path: "{{ kubespray_path }}/inventory/{{ inventory_name }}"
        state: directory
        mode: '0755'

    - name: Generate single-node inventory
      copy:
        dest: "{{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml"
        content: |
          all:
            hosts:
              node1:
                ansible_host: {{ node_ip }}
                ip: {{ node_ip }}
                access_ip: {{ node_ip }}
            children:
              kube_control_plane:
                hosts:
                  node1:
              kube_node:
                hosts:
                  node1:
              etcd:
                hosts:
                  node1:
              k8s_cluster:
                children:
                  kube_control_plane:
                  kube_node:
              calico_rr:
                hosts: {}

    - name: Find cluster playbook
      shell: "find {{ kubespray_path }} -maxdepth 2 -name 'cluster.yml' | head -1"
      register: cluster_playbook

    - name: Debug cluster playbook path
      debug:
        msg: "cluster.yml found at: {{ cluster_playbook.stdout }}"

    - name: Deploy Kubernetes (single node)
      shell: >
        {{ kubespray_path }}/venv/bin/ansible-playbook
        -i {{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml
        --become --become-user=root
        {{ cluster_playbook.stdout }}
      when: cluster_playbook.stdout != ""

