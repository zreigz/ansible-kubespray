---
- name: Prepare Kubespray environment and deploy Kubernetes
  hosts: localhost
  gather_facts: no

  vars:
    kubespray_path: "{{ playbook_dir }}/kubespray"
    inventory_path: "{{ kubespray_path }}/inventory/single"

  tasks:

    - name: Ensure kubespray submodule is initialized
      command: git submodule update --init --recursive
      args:
        chdir: "{{ playbook_dir }}"
      check_mode: no

    - name: Install Python requirements
      pip:
        requirements: "{{ kubespray_path }}/requirements.txt"
      check_mode: no

    - name: Create inventory directory
      file:
        path: "{{ inventory_path }}"
        state: directory
        mode: '0755'
      check_mode: no

    - name: Copy group_vars from sample
      copy:
        src: "{{ kubespray_path }}/inventory/sample/group_vars"
        dest: "{{ inventory_path }}/"
        remote_src: yes
      check_mode: no

    - name: Copy inventory file
      copy:
        src: "{{ playbook_dir }}/inventory.yaml"
        dest: "{{ inventory_path }}/inventory.yaml"
        remote_src: yes
      check_mode: no

    - name: Deploy Kubernetes via Kubespray
      command: >
        ansible-playbook
        -i {{ inventory_path }}/inventory.yaml
        --private-key /tmp/ssh-privatekey
        --become
        {{ kubespray_path }}/cluster.yml
      args:
        chdir: "{{ kubespray_path }}"
      check_mode: no
