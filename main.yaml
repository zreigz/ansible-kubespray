---
# ============================================================
# Play 1 – Test connection
# ============================================================
- name: Test connection to hosts
  hosts: all
  gather_facts: true

  tasks:
    - name: Ping host
      ping:

    - name: Show basic host info
      debug:
        msg: |
          hostname : {{ ansible_hostname }}
          OS       : {{ ansible_distribution }} {{ ansible_distribution_version }}
          arch     : {{ ansible_architecture }}
          IP       : {{ ansible_default_ipv4.address | default('n/a') }}

    - name: Check uptime
      command: uptime -p
      register: uptime_result
      changed_when: false

    - name: Show uptime
      debug:
        msg: "{{ uptime_result.stdout }}"

# ============================================================
# Play 2 – Install applications
# ============================================================
- name: Install applications
  hosts: all
  become: true
  gather_facts: true

  vars:
    packages_to_install:
      - htop
      - curl
      - wget
      - git
      - unzip
      - vim
      - net-tools
      - jq

  tasks:
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Update yum cache (RedHat/CentOS)
      yum:
        update_cache: true
      when: ansible_os_family == "RedHat"

    - name: Install packages (Debian/Ubuntu)
      apt:
        name: "{{ packages_to_install }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install packages (RedHat/CentOS)
      yum:
        name: "{{ packages_to_install }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Verify each package is installed
      command: "dpkg -s {{ item }}"
      register: verify_result
      changed_when: false
      failed_when: false
      loop: "{{ packages_to_install }}"
      when: ansible_os_family == "Debian"

    - name: Show installation results
      debug:
        msg: "{{ item.item }}: {{ 'OK' if item.rc == 0 else 'MISSING' }}"
      loop: "{{ verify_result.results }}"
      when: ansible_os_family == "Debian"

# ============================================================
# Play 3 – Copy files
# ============================================================
- name: Copy files to hosts
  hosts: all
  become: true
  gather_facts: true

  vars:
    remote_dir: /tmp/ansible-test

  tasks:
    - name: Create remote directory
      file:
        path: "{{ remote_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy a text file
      copy:
        dest: "{{ remote_dir }}/hello.txt"
        mode: '0644'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        content: |
          Hello from Ansible!
          Host      : {{ ansible_hostname }}
          Date      : {{ ansible_date_time.iso8601 }}
          Playbook  : {{ playbook_dir }}

    - name: Copy an executable script
      copy:
        dest: "{{ remote_dir }}/info.sh"
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        content: |
          #!/bin/bash
          echo "=== System info ==="
          uname -a
          echo "=== Disk ==="
          df -h /
          echo "=== Memory ==="
          free -h

    - name: Fetch a file back from remote host
      fetch:
        src: "{{ remote_dir }}/hello.txt"
        dest: "/tmp/fetched/{{ inventory_hostname }}/hello.txt"
        flat: true

    - name: Show copied files
      find:
        paths: "{{ remote_dir }}"
      register: copied_files

    - name: List files on remote
      debug:
        msg: "{{ copied_files.files | map(attribute='path') | list }}"

# ============================================================
# Play 4 – Uninstall applications
# ============================================================
- name: Uninstall applications
  hosts: all
  become: true
  gather_facts: true

  vars:
    packages_to_remove:
      - htop
      - vim
      - net-tools

  tasks:
    - name: Remove packages (Debian/Ubuntu)
      apt:
        name: "{{ packages_to_remove }}"
        state: absent
        purge: true
        autoremove: true
      when: ansible_os_family == "Debian"

    - name: Remove packages (RedHat/CentOS)
      yum:
        name: "{{ packages_to_remove }}"
        state: absent
        autoremove: true
      when: ansible_os_family == "RedHat"

    - name: Clean up remote test directory
      file:
        path: /tmp/ansible-test
        state: absent

    - name: Confirm packages are removed (Debian/Ubuntu)
      command: "dpkg -s {{ item }}"
      register: uninstall_check
      changed_when: false
      failed_when: false
      loop: "{{ packages_to_remove }}"
      when: ansible_os_family == "Debian"

    - name: Show uninstall results
      debug:
        msg: "{{ item.item }}: {{ 'STILL INSTALLED' if item.rc == 0 else 'removed OK' }}"
      loop: "{{ uninstall_check.results }}"
      when: ansible_os_family == "Debian"

