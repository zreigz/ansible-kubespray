---
- name: Deploy Single Node Kubernetes via Kubespray
  hosts: localhost
  gather_facts: yes

  vars:
    kubespray_path: "{{ playbook_dir }}/kubespray"
    inventory_path: "{{ playbook_dir }}/inventory"
    inventory_name: single
    node_ip: "{{ hostvars[groups['k8s'][0]]['ansible_host'] }}"
    ssh_private_key: "{{ ansible_ssh_private_key_file | default('/tmp/ssh-privatekey') }}"

  tasks:
    - name: Create Python virtual environment and install requirements
      shell: |
        python3 -m venv {{ kubespray_path }}/venv
        {{ kubespray_path }}/venv/bin/pip install --upgrade pip
        {{ kubespray_path }}/venv/bin/pip install -r {{ kubespray_path }}/requirements.txt
        {{ kubespray_path }}/venv/bin/pip install ansible
      args:
        creates: "{{ kubespray_path }}/venv/bin/ansible-playbook"
      check_mode: no

    - name: Create inventory directory
      file:
        path: "{{ inventory_path }}/{{ inventory_name }}"
        state: directory
        mode: '0755'
      check_mode: no

    - name: Generate single-node inventory
      copy:
        dest: "{{ inventory_path }}/{{ inventory_name }}/hosts.yaml"
        content: |
          all:
            hosts:
              node1:
                ansible_host: {{ node_ip }}
                ip: {{ node_ip }}
                access_ip: {{ node_ip }}
                ansible_user: ubuntu
                ansible_become: true
                ansible_ssh_private_key_file: {{ ssh_private_key }}
            children:
              kube_control_plane:
                hosts:
                  node1:
              kube_node:
                hosts:
                  node1:
              etcd:
                hosts:
                  node1:
              k8s_cluster:
                children:
                  kube_control_plane:
                  kube_node:
              calico_rr:
                hosts: {}
      check_mode: no

    - name: Deploy Kubernetes (single node)
      shell: >
        {{ kubespray_path }}/venv/bin/ansible-playbook
        -i {{ inventory_path }}/{{ inventory_name }}/hosts.yaml
        --become
        --private-key {{ ssh_private_key }}
        -e ignore_assert_errors=yes
        -e minimal_master_memory_mb=0
        -e minimal_node_memory_mb=0
        {{ kubespray_path }}/cluster.yml
      args:
        chdir: "{{ kubespray_path }}"
      check_mode: no
      when: not ansible_check_mode

