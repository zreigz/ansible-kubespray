---
- name: Deploy Single Node Kubernetes via Kubespray
  hosts: localhost
  gather_facts: yes

  vars:
    kubespray_repo: https://github.com/kubernetes-sigs/kubespray.git
    kubespray_version: release-2.30
    kubespray_path: /plural/kubespray
    inventory_name: single
    node_ip: "{{ hostvars[groups['k8s'][0]]['ansible_host'] }}"
    ssh_private_key: "{{ ansible_ssh_private_key_file | default('/tmp/ssh-privatekey') }}"

  tasks:
    - name: Install dependencies (Debian/Ubuntu control node)
      become: yes
      become_method: sudo
      apt:
        name:
          - git
          - python3
          - python3-pip
          - python3-venv
          - sshpass
          - rsync
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Remove existing kubespray directory if present
      file:
        path: "{{ kubespray_path }}"
        state: absent
      check_mode: no

    - name: Clone Kubespray
      shell: "git clone --depth=1 --branch {{ kubespray_version }} {{ kubespray_repo }} {{ kubespray_path }}"
      check_mode: no

    - name: Stat kubespray directory after clone
      stat:
        path: "{{ kubespray_path }}"
      register: kubespray_stat

    - name: Debug kubespray stat result
      debug:
        msg: "exists={{ kubespray_stat.stat.exists }} isdir={{ kubespray_stat.stat.get('isdir', 'N/A') }} owner={{ kubespray_stat.stat.get('pw_name', 'N/A') }}"

    - name: List kubespray directory contents
      shell: "ls -la {{ kubespray_path }}"
      register: kubespray_dir_contents
      check_mode: no

    - name: Debug kubespray directory contents
      debug:
        msg: "{{ kubespray_dir_contents.stdout_lines }}"

    - name: Create Python virtual environment
      shell: "python3 -m venv {{ kubespray_path }}/venv"
      check_mode: no

    - name: Upgrade pip in virtual environment
      shell: "{{ kubespray_path }}/venv/bin/pip install --upgrade pip"
      check_mode: no

    - name: Install Python requirements
      shell: "{{ kubespray_path }}/venv/bin/pip install -r {{ kubespray_path }}/requirements.txt"
      check_mode: no

    - name: Ensure ansible is installed in virtual environment
      shell: "{{ kubespray_path }}/venv/bin/pip install ansible"
      check_mode: no

    - name: Verify ansible-playbook binary exists
      stat:
        path: "{{ kubespray_path }}/venv/bin/ansible-playbook"
      register: ansible_bin

    - name: Fail if ansible-playbook not found in venv
      fail:
        msg: "ansible-playbook not found at {{ kubespray_path }}/venv/bin/ansible-playbook after pip install"
      when: not ansible_bin.stat.exists

    - name: Create inventory directory
      file:
        path: "{{ kubespray_path }}/inventory/{{ inventory_name }}"
        state: directory
        mode: '0755'
      check_mode: no

    - name: Generate single-node inventory
      copy:
        dest: "{{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml"
        content: |
          all:
            hosts:
              node1:
                ansible_host: {{ node_ip }}
                ip: {{ node_ip }}
                access_ip: {{ node_ip }}
                ansible_user: ubuntu
                ansible_become: true
                ansible_ssh_private_key_file: {{ ssh_private_key }}
            children:
              kube_control_plane:
                hosts:
                  node1:
              kube_node:
                hosts:
                  node1:
              etcd:
                hosts:
                  node1:
              k8s_cluster:
                children:
                  kube_control_plane:
                  kube_node:
              calico_rr:
                hosts: {}
      check_mode: no

    - name: Find cluster playbook
      shell: "find {{ kubespray_path }} -maxdepth 2 -name 'cluster.yml' | head -1"
      register: cluster_playbook
      check_mode: no

    - name: Debug cluster playbook path
      debug:
        msg: "cluster.yml found at: {{ cluster_playbook.stdout }}"

    - name: Deploy Kubernetes (single node) [CHECK MODE - would run this command]
      debug:
        msg: >
          Would run: {{ kubespray_path }}/venv/bin/ansible-playbook
          -i {{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml
          --become
          --private-key {{ ssh_private_key }}
          {{ cluster_playbook.stdout }}
      when: cluster_playbook.stdout != "" and ansible_check_mode

    - name: Deploy Kubernetes (single node)
      shell: >
        {{ kubespray_path }}/venv/bin/ansible-playbook
        -i {{ kubespray_path }}/inventory/{{ inventory_name }}/hosts.yaml
        --become
        --private-key {{ ssh_private_key }}
        {{ cluster_playbook.stdout }}
      args:
        chdir: "{{ kubespray_path }}"
      check_mode: no
      when: cluster_playbook.stdout != "" and not ansible_check_mode

