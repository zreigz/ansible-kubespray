---
- name: Prepare Kubespray environment
  hosts: localhost
  gather_facts: no

  vars:
    kubespray_path: "{{ playbook_dir }}/kubespray"
    kubespray_repo: https://github.com/kubernetes-sigs/kubespray.git
    kubespray_version: release-2.30
    inventory_path: "{{ kubespray_path }}/inventory/single"

  tasks:
    - name: Remove existing kubespray directory
      file:
        path: "{{ kubespray_path }}"
        state: absent
      check_mode: no

    - name: Clone Kubespray
      git:
        repo: "{{ kubespray_repo }}"
        dest: "{{ kubespray_path }}"
        version: "{{ kubespray_version }}"
        depth: 1
      check_mode: no

    - name: Install Python requirements
      shell: "pip install -r {{ kubespray_path }}/requirements.txt"
      check_mode: no

    - name: Create inventory directory
      file:
        path: "{{ inventory_path }}"
        state: directory
        mode: '0755'
      check_mode: no

    - name: Copy group_vars from sample
      copy:
        src: "{{ kubespray_path }}/inventory/sample/group_vars"
        dest: "{{ inventory_path }}/"
        remote_src: yes
      check_mode: no
