- name: Run kubespray cluster.yml
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Clone kubespray repository
      git:
        repo: https://github.com/kubernetes-sigs/kubespray.git
        dest: /tmp/kubespray
        version: master
        force: true
        update: true

    - name: Install kubespray Python requirements
      pip:
        requirements: /tmp/kubespray/requirements.txt
        executable: pip3
        extra_args: "--user --ignore-installed"

    - name: Create kubespray inventory directory
      file:
        path: /tmp/kubespray/inventory/mycluster/group_vars
        state: directory
        mode: '0755'

    - name: Copy hosts.ini to kubespray inventory
      copy:
        src: "{{ playbook_dir }}/hosts.ini"
        dest: /tmp/kubespray/inventory/mycluster/hosts.ini
        mode: '0644'

    - name: Find group_vars files
      find:
        paths: "{{ playbook_dir }}/group_vars"
        recurse: true
      register: group_vars_files

    - name: Copy group_vars to kubespray inventory
      copy:
        src: "{{ item.path }}"
        dest: "/tmp/kubespray/inventory/mycluster/group_vars/{{ item.path | relpath(playbook_dir + '/group_vars') }}"
        mode: '0644'
      loop: "{{ group_vars_files.files }}"
      when: group_vars_files.files | length > 0

    - name: Run kubespray cluster playbook
      command: >
        ansible-playbook
        -i /tmp/kubespray/inventory/mycluster/hosts.ini
        --private-key /tmp/ansible-key
        --become
        cluster.yml
      args:
        chdir: /tmp/kubespray
      environment:
        PATH: "/home/nonroot/.local/bin:{{ ansible_env.PATH }}"
      register: kubespray_result

    - name: Show kubespray output
      debug:
        var: kubespray_result.stdout_lines
