# Kubernetes version
kube_version: v1.31.0

# Network plugin - options: calico, flannel, weave, cilium
kube_network_plugin: calico

# Pod and service subnets
kube_pods_subnet: 192.168.0.0/16
kube_service_addresses: 10.96.0.0/12

# Container runtime - options: containerd, crio
container_manager: containerd

# Enable metrics server
metrics_server_enabled: true

# Kubeconfig
kubeconfig_localhost: true

# Etcd deployment type
etcd_deployment_type: kubeadm

# Allow scheduling on control plane for single-node clusters
node_labels:
  node-role.kubernetes.io/control-plane: ""
kubeadm_control_plane_taints: []

